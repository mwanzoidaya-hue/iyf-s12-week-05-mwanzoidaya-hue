<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6fa">
  <title>Little List — To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <a class="brand" href="./" aria-label="Little List home">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>little list</span>
      </a>
      <a class="practice-link" href="dom-practice.html">DOM practice <span aria-hidden="true">↗</span></a>
    </header>

    <section class="todo-card" aria-labelledby="page-title">
      <div class="card-heading">
        <div>
          <p class="eyebrow">A little progress adds up</p>
          <h1 id="page-title">Today’s tasks<span class="heading-dot">.</span></h1>
        </div>
        <div class="heading-icon" aria-hidden="true">✦</div>
      </div>

      <form class="add-form" id="todo-form">
        <label class="sr-only" for="todo-input">Add a task</label>
        <input id="todo-input" type="text" placeholder="What needs to get done?" autocomplete="off" maxlength="160">
        <button class="add-button" type="submit"><span aria-hidden="true">＋</span> Add task</button>
      </form>

      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Filter tasks" id="filters">
          <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <span class="list-label">YOUR LIST</span>
      </div>

      <ul class="todo-list" id="todo-list" aria-label="Tasks"></ul>
      <div class="empty-state" id="empty-state">
        <span class="empty-icon" aria-hidden="true">☀</span>
        <p class="empty-title">Nothing on the list yet</p>
        <p class="empty-copy">Add a task above and make today count.</p>
      </div>

      <footer class="list-footer">
        <span class="items-left" id="items-left" aria-live="polite">0 items left</span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>

    <p class="page-note">Small steps. Good things.</p>
  </main>
</body>
</html>
