<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 — Dark Mode Toggle</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f6fa; color: #25243a; transition: background-color 220ms ease, color 220ms ease; }
    body { max-width: 680px; margin: 48px auto; padding: 0 20px; }
    body.dark-mode { color-scheme: dark; background: #1d1b2b; color: #f3f1ff; }
    .card { margin-top: 22px; padding: 20px; border: 1px solid #dedde9; border-radius: 12px; background: white; transition: background-color 220ms ease, border-color 220ms ease; }
    .dark-mode .card { border-color: #403c55; background: #282538; }
    button { padding: 10px 15px; border: 0; border-radius: 8px; background: #6858dc; color: white; font: inherit; cursor: pointer; }
    a { color: #5b4bc4; }
  </style>
</head>
<body>
  <p><a href="../index.html">← To-Do List</a></p>
  <h1>Day 5: Dark Mode</h1>
  <button id="theme-toggle" type="button" aria-pressed="false">Enable dark mode</button>
  <section class="card">
    <h2>A calmer evening</h2>
    <p>Toggle the page theme. Your preference is remembered in this browser.</p>
  </section>
  <script>
    const themeButton = document.querySelector("#theme-toggle");
    const savedTheme = localStorage.getItem("dom-practice-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const useDarkMode = savedTheme ? savedTheme === "dark" : prefersDark;

    function setTheme(isDark) {
      document.body.classList.toggle("dark-mode", isDark);
      themeButton.textContent = isDark ? "Enable light mode" : "Enable dark mode";
      themeButton.setAttribute("aria-pressed", String(isDark));
    }

    setTheme(useDarkMode);
    themeButton.addEventListener("click", () => {
      const isDark = !document.body.classList.contains("dark-mode");
      setTheme(isDark);
      localStorage.setItem("dom-practice-theme", isDark ? "dark" : "light");
    });
  </script>
</body>
</html>
